[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matchop-scraping"
version = "0.1.0"
description = "Standalone Scrapling worker for MatchOp external_jobs ingestion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scrapling[fetchers]>=0.4.2",
    "curl-cffi>=0.7.4",
    "httpx>=0.27.0",
    "lxml>=5.3.0",
    "orjson>=3.10.0",
    "playwright>=1.54.0",
    "PyYAML>=6.0.2",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["matchop_scraping*"]
