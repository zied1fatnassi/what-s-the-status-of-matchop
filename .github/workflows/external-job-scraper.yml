name: External Job Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scraping/pyproject.toml

      - name: Install worker dependencies
        working-directory: scraping
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run scraper
        working-directory: scraping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MATCHOP_GREENHOUSE_URLS: ${{ secrets.MATCHOP_GREENHOUSE_URLS }}
          MATCHOP_LEVER_URLS: ${{ secrets.MATCHOP_LEVER_URLS }}
          MATCHOP_WORKABLE_URLS: ${{ secrets.MATCHOP_WORKABLE_URLS }}
          MATCHOP_SCRAPER_TIMEOUT: ${{ secrets.MATCHOP_SCRAPER_TIMEOUT }}
          MATCHOP_SCRAPER_RETRIES: ${{ secrets.MATCHOP_SCRAPER_RETRIES }}
          MATCHOP_SCRAPER_IMPERSONATE: ${{ secrets.MATCHOP_SCRAPER_IMPERSONATE }}
          MATCHOP_SCRAPER_STEALTH: ${{ secrets.MATCHOP_SCRAPER_STEALTH }}
        run: python run_worker.py
