<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="MatchOp - Match the Opportunity. Connect students with top companies through an intuitive matching experience." />
  <meta name="keywords" content="jobs, internships, students, recruitment, matching, career" />
  
  <link rel="canonical" href="https://matchop.tech/" />

  <meta property="og:type" content="website" />

  <meta property="twitter:card" content="summary_large_image" />
